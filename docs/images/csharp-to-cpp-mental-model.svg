<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect width="1400" height="850" fill="#f9fafb"/>
  <text x="70" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#111827">C# to C++ Mental Model</text>
  <text x="70" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#4b5563">Same programming ideas, closer to memory and hardware</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="90" y="220" width="560" height="500" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="130" y="285" font-size="38" font-weight="700" fill="#7c3aed">C# Habit</text>
    <line x1="130" y1="325" x2="610" y2="325" stroke="#e5e7eb" stroke-width="2"/>
    <text x="130" y="385" font-size="26" fill="#374151">Objects are usually references</text>
    <text x="130" y="445" font-size="26" fill="#374151">Runtime manages memory</text>
    <text x="130" y="505" font-size="26" fill="#374151">Libraries hide many details</text>
    <text x="130" y="565" font-size="26" fill="#374151">Errors often become exceptions</text>
    <text x="130" y="625" font-size="26" fill="#374151">You focus on app behavior</text>

    <rect x="750" y="220" width="560" height="500" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="790" y="285" font-size="38" font-weight="700" fill="#0f766e">C++ / OpenGL Habit</text>
    <line x1="790" y1="325" x2="1270" y2="325" stroke="#e5e7eb" stroke-width="2"/>
    <text x="790" y="385" font-size="26" fill="#374151">Values and pointers both matter</text>
    <text x="790" y="445" font-size="26" fill="#374151">You clean up many resources</text>
    <text x="790" y="505" font-size="26" fill="#374151">Graphics APIs expose details</text>
    <text x="790" y="565" font-size="26" fill="#374151">Many APIs return success/failure</text>
    <text x="790" y="625" font-size="26" fill="#374151">You control data sent to hardware</text>

    <rect x="330" y="760" width="740" height="58" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="375" y="798" font-size="25" font-weight="700" fill="#312e81">Best approach: learn one concept, edit one line, run, observe.</text>
  </g>
</svg>
